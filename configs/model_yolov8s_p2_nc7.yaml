# YOLOv8s-P2：在标准 P3/P4/P5 检测头之外增加 P2（步长 4）检测头。
# 每层格式：[输入层编号, 重复次数, 模块, 模块参数]
nc: 7
depth_multiple: 0.33
width_multiple: 0.50
max_channels: 1024

backbone:
  - [-1, 1, Conv, [64, 3, 2]]       # 0: P1/2
  - [-1, 1, Conv, [128, 3, 2]]      # 1: P2/4
  - [-1, 3, C2f, [128, true]]       # 2: 保存高分辨率浅层细节
  - [-1, 1, Conv, [256, 3, 2]]      # 3: P3/8
  - [-1, 6, C2f, [256, true]]       # 4
  - [-1, 1, Conv, [512, 3, 2]]      # 5: P4/16
  - [-1, 6, C2f, [512, true]]       # 6
  - [-1, 1, Conv, [1024, 3, 2]]     # 7: P5/32
  - [-1, 3, C2f, [1024, true]]      # 8
  - [-1, 1, SPPF, [1024, 5]]        # 9: 扩大感受野

head:
  # 自顶向下融合：P5 -> P4 -> P3 -> P2
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]             # 12: 融合后的 P4

  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]             # 15: 融合后的 P3

  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 3, C2f, [128]]             # 18: 新增 P2/4 极小目标特征

  # 自底向上再次融合：P2 -> P3 -> P4 -> P5
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 15], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]             # 21: P3/8

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]             # 24: P4/16

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]            # 27: P5/32

  - [[18, 21, 24, 27], 1, Detect, [nc]]  # 四个尺度共同预测框和类别

